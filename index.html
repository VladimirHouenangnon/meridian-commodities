<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Commodities — Négoce international de matières physiques</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F6F3;--sf:#fff;--ink:#10252A;--mu:#566669;--ln:#DCE2DD;--br:#0F3D3E;--bi:#fff;--ac:#B8872F;--up:#1B7F4B;--dn:#B3362B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B191C;--sf:#122428;--ink:#E7EFED;--mu:#93A7AA;--ln:#233B40;--br:#2E8B7A;--ac:#D4A24C;--up:#4CC38A;--dn:#F0766B}}
:root[data-theme="dark"]{--bg:#0B191C;--sf:#122428;--ink:#E7EFED;--mu:#93A7AA;--ln:#233B40;--br:#2E8B7A;--ac:#D4A24C;--up:#4CC38A;--dn:#F0766B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Public Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,6vw,3.8rem)}h2{font-size:1.9rem}h3{font-size:1.15rem}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{max-width:1120px;margin:auto;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.logo{font-family:'Familjen Grotesk',sans-serif;font-weight:700;font-size:1.25rem;text-decoration:none;display:flex;align-items:center;gap:.5rem}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--ac) 0 25%,var(--br) 0 100%)}
nav{display:flex;gap:.25rem;overflow-x:auto;margin-left:auto}
nav a{padding:.45rem .8rem;border-radius:6px;text-decoration:none;color:var(--mu);font-weight:500;white-space:nowrap}
nav a.on{background:var(--br);color:var(--bi)}
main{max-width:1120px;margin:auto;padding:1.5rem 1rem 3rem}
.btn{display:inline-block;border:0;border-radius:6px;padding:.7rem 1.2rem;background:var(--br);color:var(--bi);font:600 1rem 'Public Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ln)}.btn.sm{padding:.3rem .7rem;font-size:.85rem}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{padding:2.5rem 0 1.5rem;max-width:760px}.hero p{color:var(--mu);font-size:1.15rem;max-width:56ch}
.row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem}
.board{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow-x:auto;margin:1.5rem 0}
.board h3{padding:.9rem 1rem 0;margin:0}.board small{display:block;padding:0 1rem .5rem;color:var(--mu)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:.65rem 1rem;border-top:1px solid var(--ln);font-size:.95rem}th{color:var(--mu);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:.6rem;vertical-align:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:1.1rem;display:flex;flex-direction:column;gap:.4rem}
.card .top{height:6px;border-radius:3px;margin-bottom:.4rem}.card p{margin:0;color:var(--mu);font-size:.93rem}
.price{font:700 1.4rem 'Familjen Grotesk',sans-serif}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:.4rem .9rem;border-radius:99px;font:500 .9rem 'Public Sans',sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem;margin:2rem 0}
form{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:1.2rem;display:grid;gap:.9rem;max-width:640px}
label{display:grid;gap:.3rem;font-weight:500;font-size:.93rem}
input,select,textarea{font:inherit;padding:.6rem .7rem;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
fieldset{border:1px solid var(--ln);border-radius:6px;padding:.6rem .8rem}legend{font-weight:500;font-size:.93rem}
fieldset label{display:inline-flex;grid-auto-flow:column;align-items:center;gap:.4rem;margin:.2rem .9rem .2rem 0;font-weight:400}fieldset input{width:auto}
.seg{display:flex;gap:.5rem}.seg .chip{flex:1;text-align:center;padding:.6rem}
.ok{background:var(--sf);border:1px solid var(--up);border-radius:10px;padding:1.2rem;max-width:640px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin:1rem 0}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:1rem}.kpi b{display:block;font:700 1.9rem 'Familjen Grotesk',sans-serif}.kpi span{color:var(--mu);font-size:.9rem}
.tag{padding:.15rem .55rem;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--ln)}
.tag.Approved,.tag.Live{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}.tag.Rejected,.tag.Paused{background:color-mix(in srgb,var(--dn) 20%,transparent);color:var(--dn)}
.note{color:var(--mu);font-size:.88rem}
footer{border-top:1px solid var(--ln);padding:1.5rem 1rem;text-align:center;color:var(--mu);font-size:.88rem}
@media(prefers-reduced-motion:no-preference){.tick{animation:f 1.2s ease-out}@keyframes f{from{opacity:.2}}}
.lg{display:flex;gap:.25rem}.lg .chip{padding:.3rem .7rem}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#home"><i></i>Meridian Commodities</a>
<nav id="nav"></nav><div class="lg" role="group" aria-label="Langue / Language"><button class="chip" data-lang="fr">FR</button><button class="chip" data-lang="en">EN</button></div></div></header>
<main id="app"></main>
<footer id="ft"></footer>
<script>
const CO={name:'[NOM DE LA SOCIÉTÉ]',form:'[FORME JURIDIQUE]',reg:'[N° D’IMMATRICULATION]',addr:'[ADRESSE]',country:'[PAYS]',email:'contact@votre-domaine.com',host:'[HÉBERGEUR]'};
let LANG='fr';try{LANG=localStorage.getItem('mc-l')||'fr'}catch(e){}
const I=()=>LANG=='fr'?0:1,t=(a,b)=>LANG=='fr'?a:b,w=x=>Array.isArray(x)?x[I()]:x;
const G={prec:['Métaux précieux','Precious metals'],batt:['Métaux de batterie','Battery metals'],base:['Métaux de base','Base metals'],ore:['Minerais','Ores']};
const C=[
{id:'gold',n:['Or','Gold'],g:'prec',col:'#C9A227',o:['Ghana, Mali','Ghana, Mali'],gr:['Barres de doré, 90–99,5 % Au','Dore bars, 90–99.5% Au'],d:['Or doré et lingots affinés, avec certificat d’essai.','Dore and refined bullion, assay certified.']},
{id:'silver',n:['Argent','Silver'],g:'prec',col:'#A8B0B8',o:['Mexique, Pérou','Mexico, Peru'],gr:['Barres, 99,9 % Ag','Bars, 99.9% Ag'],d:['Barres affinées et concentré, avec essai indépendant.','Refined bars and concentrate with independent assay.']},
{id:'cobalt',n:['Cobalt','Cobalt'],g:'batt',col:'#2F5DA8',o:['RD Congo, Indonésie','DR Congo, Indonesia'],gr:['Hydroxyde, 30–35 % Co','Hydroxide, 30–35% Co'],d:['Hydroxyde et métal de qualité cathode, avec documents d’approvisionnement responsable.','Hydroxide and cathode-grade metal, with responsible sourcing documents.']},
{id:'copper',n:['Cuivre','Copper'],g:'base',col:'#B8683A',o:['Chili, Zambie','Chile, Zambia'],gr:['Cathodes grade A, 99,99 %','Cathode Grade A, 99.99%'],d:['Cathodes et lots de concentré.','Cathodes and concentrate lots.']},
{id:'lithium',n:['Lithium','Lithium'],g:'batt',col:'#7C5CBF',o:['Australie, Chili','Australia, Chile'],gr:['Carbonate, 99,5 % qualité batterie','Carbonate, 99.5% battery grade'],d:['Carbonate et concentré de spodumène pour batteries.','Carbonate and spodumene concentrate for batteries.']},
{id:'bauxite',n:['Bauxite','Bauxite'],g:'ore',col:'#A5482E',o:['Guinée, Australie','Guinea, Australia'],gr:['Al₂O₃ 45–50 %','Al₂O₃ 45–50%'],d:['Bauxite métallurgique expédiée en vrac.','Metallurgical-grade bauxite shipped in bulk.']},
{id:'iron',n:['Minerai de fer','Iron ore'],g:'ore',col:'#7A3B2E',o:['Brésil, Australie','Brazil, Australia'],gr:['Fines Fe 62 %','Fe 62% fines'],d:['Fines et calibré pour les aciéries.','Fines and lump for steel mills.']}];
let f='all',pre='';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=(a,b)=>`<h3>${t(a[0],a[1])}</h3><p class="note">${t(b[0],b[1])}</p>`;
const V={
home:()=>`<section class="hero"><h1>${t('Métaux et minerais physiques, négociés au-delà des frontières.','Physical metals and ores, traded across borders.')}</h1><p>${t('Meridian met en relation producteurs et acheteurs industriels pour l’or, l’argent, le cobalt, le cuivre, le lithium, la bauxite et le minerai de fer.','Meridian connects producers and industrial buyers for gold, silver, cobalt, copper, lithium, bauxite and iron ore.')}</p><div class="row"><a class="btn" href="#register">${t('Ouvrir un compte','Open an account')}</a><a class="btn alt" href="#catalog">${t('Parcourir le catalogue','Browse the catalog')}</a></div></section>
<div class="chips">${C.map(c=>`<a class="chip" href="#catalog"><span class="sw" style="background:${c.col}"></span>${w(c.n)}</a>`).join('')}</div>
<div class="cols"><div>${cl(['Contreparties vérifiées','Verified counterparties'],['Chaque acheteur et vendeur est contrôlé (KYC) avant toute transaction.','Every buyer and seller is screened (KYC) before any transaction.'])}</div><div>${cl(['Essais indépendants','Independent assay'],['La qualité est confirmée par un inspecteur tiers au chargement.','Quality is confirmed by a third-party inspector at loading.'])}</div><div>${cl(['Prix sur demande','Prices on request'],['Les prix dépendent de la qualité, du volume et de l’Incoterm. Demandez un devis.','Prices depend on grade, volume and Incoterm. Request a quote.'])}</div></div>`,
catalog:()=>{const gs=['all',...Object.keys(G)],list=C.filter(c=>f=='all'||c.g==f);
return `<h2>${t('Catalogue des matières','Commodities catalog')}</h2><div class="chips" role="group" aria-label="${t('Filtrer par catégorie','Filter by category')}">${gs.map(g=>`<button class="chip ${g==f?'on':''}" data-f="${g}">${g=='all'?t('Tous','All'):w(G[g])}</button>`).join('')}</div>
<div class="grid">${list.map(c=>`<article class="card"><div class="top" style="background:${c.col}"></div><h3>${w(c.n)}</h3><p>${w(c.d)}</p><p><b>${t('Qualité :','Grade:')}</b> ${w(c.gr)}<br><b>${t('Origines possibles :','Possible origins:')}</b> ${w(c.o)}</p><div class="row" style="margin-top:.4rem"><a class="btn sm" href="#contact" data-q="${c.id}">${t('Demander un devis','Request a quote')}</a></div></article>`).join('')}</div>`},
register:()=>`<h2>${t('S’inscrire comme acheteur ou vendeur','Register as a buyer or seller')}</h2><p class="note">${t('Votre demande est envoyée par e-mail à notre équipe, qui vous répond après vérification.','Your request is emailed to our team, who reply after review.')}</p><div id="rf"><form id="reg"><div class="seg" role="group" aria-label="${t('Type de compte','Account type')}"><button type="button" class="chip on" data-role="Buyer">${t('Je suis acheteur','I’m a buyer')}</button><button type="button" class="chip" data-role="Seller">${t('Je suis vendeur','I’m a seller')}</button></div><label>${t('Nom de l’entreprise','Company name')}<input name="co" required></label><label>${t('Pays','Country')}<input name="ct" required></label><label>${t('E-mail professionnel','Work email')}<input name="em" type="email" required></label><fieldset><legend>${t('Matières d’intérêt','Commodities of interest')}</legend>${C.map(c=>`<label><input type="checkbox" name="cm" value="${w(c.n)}">${w(c.n)}</label>`).join('')}</fieldset><label><span><input type="checkbox" name="ok" required style="width:auto"> ${t('J’accepte la','I accept the')} <a href="#legal">${t('politique de confidentialité','privacy policy')}</a></span></label><button class="btn">${t('Envoyer par e-mail','Send by email')}</button></form></div>`,
contact:()=>`<h2>${t('Contacter notre desk','Contact our desk')}</h2><p class="note">${t('Un trader vous répond sous un jour ouvré.','A trader replies within one business day.')}</p><div id="cf"><form id="con"><label>${t('Votre nom','Your name')}<input name="nm" required></label><label>${t('E-mail','Email')}<input name="em" type="email" required></label><label>${t('Matière','Commodity')}<select name="cm">${C.map(c=>`<option value="${w(c.n)}" ${c.id==pre?'selected':''}>${w(c.n)}</option>`).join('')}</select></label><label>Message<textarea name="msg" rows="4" required placeholder="${t('Quantité, qualité, port de livraison et calendrier','Quantity, grade, delivery port and timing')}"></textarea></label><label><span><input type="checkbox" name="ok" required style="width:auto"> ${t('J’accepte la','I accept the')} <a href="#legal">${t('politique de confidentialité','privacy policy')}</a></span></label><button class="btn">${t('Envoyer par e-mail','Send by email')}</button></form></div>`,
legal:()=>{const p=(a,b)=>`<p>${t(a,b)}</p>`;return `<h2>${t('Informations légales','Legal information')}</h2><p class="note">${t('Modèle à faire relire par un avocat avant la mise en ligne.','Template to be reviewed by a lawyer before launch.')}</p>
<h3>${t('Éditeur du site','Site publisher')}</h3>${p(`${CO.name}, ${CO.form}, ${CO.reg}. ${CO.addr}, ${CO.country}. E-mail : ${CO.email}. Hébergeur : ${CO.host}.`,`${CO.name}, ${CO.form}, ${CO.reg}. ${CO.addr}, ${CO.country}. Email: ${CO.email}. Host: ${CO.host}.`)}
<h3>${t('Nature des informations','Nature of the information')}</h3>${p('Ce site présente des matières premières physiques à titre informatif. Il ne constitue ni une offre ferme, ni un conseil en investissement. Les prix sont communiqués sur demande et peuvent changer sans préavis.','This site presents physical commodities for information only. It is neither a binding offer nor investment advice. Prices are given on request and may change without notice.')}
<h3>${t('Conditions d’utilisation','Terms of use')}</h3>${p('Toute transaction est soumise à la vérification préalable de l’identité des parties (KYC), au respect des sanctions internationales et à la signature d’un contrat distinct. L’inscription ne garantit aucune transaction.','Any transaction is subject to prior identity checks (KYC), compliance with international sanctions and a separate signed contract. Registration does not guarantee any transaction.')}
<h3>${t('Données personnelles','Personal data')}</h3>${p(`Les informations saisies dans les formulaires (nom, entreprise, pays, e-mail, message) sont envoyées par e-mail à ${CO.name} pour répondre à votre demande. Elles ne sont pas vendues. Vous pouvez demander l’accès, la correction ou la suppression de vos données à ${CO.email}.`,`Information entered in the forms (name, company, country, email, message) is emailed to ${CO.name} to answer your request. It is not sold. You can request access, correction or deletion of your data at ${CO.email}.`)}
<h3>Cookies</h3>${p('Ce site n’utilise aucun cookie de suivi. Il mémorise seulement votre choix de langue dans votre navigateur.','This site uses no tracking cookies. It only stores your language choice in your browser.')}`}};
function render(){const r=(location.hash||'#home').slice(1),k=V[r]?r:'home';document.documentElement.lang=LANG;document.title='Meridian Commodities — '+t('Négoce international de matières physiques','International physical trading');
$('#nav').innerHTML=[['home',t('Accueil','Home')],['catalog',t('Catalogue','Catalog')],['register',t('Inscription','Register')],['contact','Contact']].map(x=>`<a href="#${x[0]}" class="${x[0]==k?'on':''}">${x[1]}</a>`).join('');
$('#ft').innerHTML=`© ${new Date().getFullYear()} ${CO.name} · <a href="#legal">${t('Informations légales et confidentialité','Legal information and privacy')}</a>`;
document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang==LANG));
$('#app').innerHTML=V[k]();scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang],[data-f],[data-q],[data-role]');if(!b)return;const d=b.dataset;
if(d.lang){LANG=d.lang;try{localStorage.setItem('mc-l',LANG)}catch(x){}render()}
else if(d.f){f=d.f;render()}
else if(d.q){pre=d.q}
else if(d.role){document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x==b))}});
document.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),reg=e.target.id=='reg';let sub,body;
if(reg){const role=document.querySelector('[data-role].on').dataset.role=='Buyer'?t('Acheteur','Buyer'):t('Vendeur','Seller');sub=t('Inscription ','Registration ')+role+' - '+fd.get('co');body=[role,fd.get('co'),fd.get('ct'),fd.get('em'),fd.getAll('cm').join(', ')].join('\n')}
else{sub=t('Demande de devis - ','Quote request - ')+fd.get('cm');body=fd.get('nm')+' <'+fd.get('em')+'>\n\n'+fd.get('msg')}
location.href='mailto:'+CO.email+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);
$(reg?'#rf':'#cf').innerHTML=`<div class="ok"><h3>${t('Votre application e-mail s’ouvre','Your email app is opening')}</h3><p>${t('Envoyez le message pré-rempli pour terminer. Rien n’est transmis tant que vous ne l’avez pas envoyé.','Send the pre-filled message to finish. Nothing is transmitted until you send it.')}</p></div>`});
addEventListener('hashchange',render);render();
</script>
</body>
</html>
